[project]
name = "whab"
dynamic = ["version"]
description = "We Have A Budget — a local Python and SQLite budgeting app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "jinja2==3.1.6",
  "httpx==0.28.1",
  "cryptography==50.0.2",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[project.urls]
Repository = "https://github.com/Fillll/whab"
Issues = "https://github.com/Fillll/whab/issues"

[project.entry-points."whab.plugins"]
plaid = "whab.integrations.plaid.plugin:plugin"
sqlite = "whab.storage.sqlite.plugin:plugin"
web = "whab.interfaces.web.plugin:plugin"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["whab*"]

[tool.setuptools.package-data]
"whab.interfaces.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]
"whab.integrations.plaid" = ["templates/*.html", "static/*.js"]

[tool.setuptools.dynamic]
version = {attr = "whab.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
