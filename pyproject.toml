[project]
name = "ihab"
dynamic = ["version"]
description = "I Have A Budget — a local Python and SQLite budgeting app"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "jinja2==3.1.6",
  "httpx==0.28.1",
  "cryptography==50.0.2",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ihab"]

[tool.setuptools.dynamic]
version = {attr = "ihab.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
