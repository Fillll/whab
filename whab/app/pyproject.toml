[project]
name = "whab"
dynamic = ["version"]
description = "We Have A Budget — an extensible Python budgeting app"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "jinja2==3.1.6",
  "httpx==0.28.1",
  "cryptography==50.0.2",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "coverage==7.16.2", "ruff==0.17.0"]
bundled = [
  "whab_plugin_bank_logos>=1.2.0,<2",
  "whab_plugin_client>=1.3.0,<2",
  "whab_plugin_plaid>=1.1.2,<2",
  "whab_plugin_server>=1.0.1,<2",
  "whab_plugin_sqlite>=1.4.0,<2",
  "whab_plugin_web>=1.15.1,<2",
  "whab_plugin_ynab>=1.2.0,<2",
]

[project.urls]
Repository = "https://github.com/Fillll/whab"
Issues = "https://github.com/Fillll/whab/issues"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["whab", "whab.*"]

[tool.setuptools.dynamic]
version = {attr = "whab.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
addopts = "-q"

[tool.coverage.run]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true
# Static typing imports have no runtime behavior. Do not exclude runtime code
# or honor pragma-based coverage exemptions in contributor plugins.
exclude_lines = ['^\s*if (typing\.)?TYPE_CHECKING:']
partial_branches = []

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
