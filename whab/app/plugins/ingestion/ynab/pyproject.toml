[project]
name = "whab_plugin_ynab"
version = "1.3.1"
description = "Local YNAB ZIP import plugin for WHAB"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["whab>=2.21,<3"]

[project.entry-points."whab.plugins"]
ynab = "whab_plugin_ynab.plugin:plugin"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["whab_plugin_ynab", "whab_plugin_ynab.*"]

[tool.setuptools.package-data]
whab_plugin_ynab = ["templates/*.html", "static/*.js"]

[tool.whab.plugin]
requires = []
conflicts = []
api-version = 1
capabilities = [
  { name = "ingestion.file", version = 1, composition = "additive" },
]
lifecycle = "restart"
legacy = true
authority = "unknown"
state-version = 1
state-upgrades = []
support = "maintained"
