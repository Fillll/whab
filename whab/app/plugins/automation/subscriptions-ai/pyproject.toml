[project]
name = "whab_plugin_subscriptions_ai"
version = "1.0.1"
description = "Optional AI subscription classification for WHAB"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["whab>=2.52,<3", "whab_plugin_subscriptions>=1.3.0,<2", "whab_plugin_ai_credentials>=1.0.0,<2"]

[project.entry-points."whab.plugins"]
subscriptions-ai = "whab_plugin_subscriptions_ai.plugin:plugin"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whab_plugin_subscriptions_ai = ["plugin.json", "operations.json"]

[tool.whab.plugin]
api-version = 1
capabilities = [{ name = "interface.api", version = 1, composition = "additive" }]
requires = [{ name = "subscriptions.labels", min_version = 1 }, { name = "ai.credentials", min_version = 1 }]
conflicts = []
lifecycle = "restart"
legacy = false
authority = "local"
state-version = 1
state-upgrades = []
support = "maintained"
