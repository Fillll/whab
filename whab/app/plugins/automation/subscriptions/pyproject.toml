[project]
name = "whab_plugin_subscriptions"
version = "1.3.2"
description = "Manual subscription labels and spend reports for WHAB"
readme = "README.md"
requires-python = ">=3.15,<3.16"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["whab>=2.52,<3"]

[project.entry-points."whab.plugins"]
subscriptions = "whab_plugin_subscriptions.plugin:plugin"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whab_plugin_subscriptions = ["plugin.json", "operations.json"]

[tool.whab.plugin]
api-version = 1
capabilities = [{ name = "interface.api", version = 1, composition = "additive" }, { name = "subscriptions.labels", version = 1, composition = "additive" }]
requires = []
conflicts = []
lifecycle = "restart"
legacy = false
authority = "local"
state-version = 1
state-upgrades = []
support = "maintained"
