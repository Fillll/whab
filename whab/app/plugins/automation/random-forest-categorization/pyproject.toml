[project]
name = "whab_plugin_random_forest_categorization"
version = "1.1.0"
description = "Local random forest category suggestions for WHAB"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["whab>=2.19,<3", "scikit-learn==1.9.1"]

[project.entry-points."whab.plugins"]
random-forest-categorization = "whab_plugin_random_forest_categorization.plugin:plugin"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.whab.plugin]
api-version = 1
capabilities = [{ "name" = "categorization", "version" = 1, "composition" = "additive" }]
requires = []
conflicts = []
lifecycle = "restart"
legacy = true
authority = "unknown"
state-version = 1
state-upgrades = []
support = "maintained"
