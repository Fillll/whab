[project]
name = "whab-web-plugin"
version = "1.3.0"
description = "Web interface plugin for WHAB"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["whab>=2.2,<3", "MarkupSafe>=2,<4"]

[project.entry-points."whab.plugins"]
web = "whab_web.plugin:plugin"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["whab_web", "whab_web.*"]

[tool.setuptools.package-data]
whab_web = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]
