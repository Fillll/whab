[project]
name = "whab_plugin_web"
version = "1.26.0"
description = "Web interface plugin for WHAB"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["whab>=2.19,<3", "MarkupSafe>=2,<4"]

[project.entry-points."whab.plugins"]
web = "whab_plugin_web.plugin:plugin"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["whab_plugin_web", "whab_plugin_web.*"]

[tool.setuptools.package-data]
whab_plugin_web = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.whab.plugin]
api-version = 1
capabilities = [{ "name" = "interface.ui", "version" = 1, "composition" = "singleton" }]
requires = []
conflicts = []
lifecycle = "restart"
legacy = true
authority = "unknown"
state-version = 1
state-upgrades = []
support = "maintained"
