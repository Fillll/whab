[project]
name = "whab_plugin_web"
version = "1.16.0"
description = "Web interface plugin for WHAB"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["whab>=2.13,<3", "MarkupSafe>=2,<4"]

[project.entry-points."whab.plugins"]
web = "whab_plugin_web.plugin:plugin"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["whab_plugin_web", "whab_plugin_web.*"]

[tool.setuptools.package-data]
whab_plugin_web = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]
