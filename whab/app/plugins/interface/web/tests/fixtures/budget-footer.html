<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Budget footer regression</title>
<style>
  body { font: 14px system-ui; margin: 24px; }
  table { border-collapse: collapse; }
  th, td { padding: 8px 16px; border-bottom: 1px solid #bbb; text-align: left; }
  iframe { display: block; border: 1px solid #888; margin: 16px 0; }
</style>
<h1>Budget footer regression</h1>
<p>Fictional budgets using the shipped stylesheet. Add category must stay fully visible, with a bottom inset and a reachable final row.</p>
<table><thead><tr><th>Viewport / theme / banner / rows</th><th>Button bottom gap</th><th>Result</th></tr></thead><tbody></tbody></table>
<script type="module">
const stylesheet = new URL('../../src/whab_plugin_web/static/styles.css', location.href);
const afterPaint = async win => {
  await new Promise(resolve => win.requestAnimationFrame(resolve));
  await new Promise(resolve => win.requestAnimationFrame(resolve));
};
let cases = 0;
for (const [width, height] of [[1911, 1602], [1280, 800], [980, 360], [700, 640], [390, 720]]) {
  for (const theme of ['light', 'dark']) {
    for (const demo of [false, true]) {
      for (const count of [0, 60]) {
        const frame = document.createElement('iframe');
        frame.width = width;
        frame.height = height;
        frame.title = `${width} x ${height}, ${theme}, banner ${demo}, ${count} rows`;
        const loaded = new Promise(resolve => frame.onload = resolve);
        frame.srcdoc = `<!doctype html><html lang="en" data-theme="${theme}"><meta charset="utf-8"><link rel="stylesheet" href="${stylesheet}">
          <div class="app-shell"><main>
            <header class="topbar"><div class="breadcrumb">Fictional budget</div><span class="mode-badge">${demo ? 'Sample data' : 'Sandbox mode'}</span></header>
            ${demo ? '<div class="demo-ribbon"><span>You’re exploring sample data. Your accounts are separate.</span><a class="text-link" href="#">Set up my budget →</a></div>' : ''}
            <div class="page-content"><div class="budget-planner">
              <div class="budget-toolbar"><nav class="month-strip"><a class="month-link is-selected" href="#">Oct</a><a class="month-link" href="#">Nov</a><a class="month-link" href="#">Dec</a></nav><a class="button secondary" href="#">This month</a></div>
              <div class="budget-workspace"><section class="budget-table-section" aria-label="Monthly category budget">
                <div class="budget-editing-key"><span>Editable assigned amounts</span><span>Read-only summaries</span></div>
                <div class="budget-matrix-scroll"><table class="budget-matrix"><colgroup><col class="budget-category-col">${'<col>'.repeat(9)}</colgroup>
                  <tbody class="budget-overview"><tr class="budget-overview-row"><th>Carried in</th><td colspan="9">100.00<details class="budget-summary-details"><summary>Where it comes from</summary><p>Previously unassigned money and money set aside.</p></details></td></tr></tbody>
                  <tbody class="budget-spending"><tr class="budget-columns"><th>Category</th>${'<th>Assigned</th><th>Activity</th><th>Available</th>'.repeat(3)}</tr>${Array.from({length: count}, (_, i) => `<tr class="budget-category-row"><td><a class="budget-category-link" href="#">Fictional category ${i + 1}</a></td>${'<td>100.00</td>'.repeat(9)}</tr>`).join('')}</tbody>
                  <tfoot><tr class="budget-total-row"><td>Total</td>${'<td>100.00</td>'.repeat(9)}</tr></tfoot>
                </table></div>
                <div class="budget-table-footer"><button class="button secondary">＋ Add category</button></div>
              </section></div>
            </div></div>
          </main></div></html>`;
        document.body.append(frame);
        await loaded;
        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        await Promise.all(doc.getAnimations().map(animation => animation.finished));
        await afterPaint(win);
        const scroll = doc.querySelector('.budget-matrix-scroll');
        const button = doc.querySelector('.budget-table-footer button');
        const before = button.getBoundingClientRect();
        const gap = Math.round((height - before.bottom) * 100) / 100;
        const inset = width > 760 ? 20 : 16;
        scroll.scrollTop = scroll.scrollHeight;
        scroll.scrollLeft = scroll.scrollWidth;
        await afterPaint(win);
        const end = doc.querySelector('tfoot').getBoundingClientRect();
        const bounds = scroll.getBoundingClientRect();
        const after = button.getBoundingClientRect();
        const passed = gap >= inset - 1 && (!count || Math.abs(gap - inset) <= 1)
          && Math.abs(before.top - after.top) <= 1
          && end.bottom <= bounds.bottom + 1 && end.top >= bounds.top
          && doc.documentElement.scrollHeight <= height
          && doc.documentElement.scrollWidth <= width;
        const row = document.createElement('tr');
        row.dataset.measurements = JSON.stringify({ gap, before: before.toJSON(), after: after.toJSON(),
          end: end.toJSON(), scroll: bounds.toJSON(), outerHeight: doc.documentElement.scrollHeight,
          outerWidth: doc.documentElement.scrollWidth });
        row.innerHTML = `<td>${width} × ${height} / ${theme} / ${demo ? 'sample' : 'no banner'} / ${count}</td><td>${gap} px (minimum ${inset})</td><td>${passed ? 'PASS' : 'FAIL'}</td>`;
        document.querySelector('tbody').append(row);
        cases++;
      }
    }
  }
}
const failures = [...document.querySelectorAll('tbody tr')].filter(row => row.lastElementChild.textContent === 'FAIL').length;
document.title = failures ? `FAIL: ${failures} budget footer cases` : `PASS: ${cases} budget footer cases`;
document.querySelector('h1').textContent = document.title;
</script>
</html>
