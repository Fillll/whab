[project]
name = "whab_plugin_cli"
version = "2.16.0"
description = "Machine-usable command line interface for WHAB"
readme = "README.md"
requires-python = ">=3.15,<3.16"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["whab>=2.70,<3"]

[project.scripts]
whab = "whab_plugin_cli.console:main"
whab-cli = "whab_plugin_cli.client:main"

[project.entry-points."whab.plugins"]
cli = "whab_plugin_cli.plugin:plugin"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whab_plugin_cli = ["plugin.json", "operations.json"]

[tool.whab.plugin]
api-version = 1
capabilities = [{ name = "interface.api", version = 1, composition = "additive" }]
requires = []
conflicts = []
lifecycle = "restart"
legacy = false
authority = "local"
state-version = 1
state-upgrades = []
support = "maintained"
