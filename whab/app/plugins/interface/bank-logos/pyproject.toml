[project]
name = "whab_plugin_bank_logos"
version = "1.3.0"
description = "Public bank artwork plugin for WHAB"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["whab>=2.11,<3", "httpx==0.28.1"]

[project.entry-points."whab.plugins"]
bank-logos = "whab_plugin_bank_logos.plugin:plugin"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["whab_plugin_bank_logos", "whab_plugin_bank_logos.*"]

[tool.whab.plugin]
api-version = 1
capabilities = [{ "name" = "branding.bank", "version" = 1, "composition" = "additive" }]
requires = []
conflicts = []
lifecycle = "restart"
legacy = true
authority = "unknown"
state-version = 1
state-upgrades = []
support = "maintained"
