[project]
name = "whab_plugin_json"
version = "1.1.0"
description = "Independent persistent local JSON budget storage for WHAB"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["whab>=2.27,<3"]
classifiers = ["Operating System :: POSIX", "Operating System :: MacOS"]

[project.entry-points."whab.plugins"]
json = "whab_plugin_json.plugin:plugin"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["whab_plugin_json", "whab_plugin_json.*"]

[tool.whab.plugin]
requires = []
conflicts = []
api-version = 1
capabilities = [
  { name = "ledger.mutate", version = 1, composition = "singleton" },
  { name = "ledger.read", version = 1, composition = "singleton" },
  { name = "provider.state", version = 1, composition = "singleton" },
  { name = "provider.sync", version = 1, composition = "singleton" },
  { name = "receipts", version = 1, composition = "additive" },
  { name = "transfer.neutral", version = 1, composition = "additive" },
  { name = "transfer.prepare", version = 1, composition = "additive" },
]
lifecycle = "restart"
legacy = false
authority = "local"
state-version = 1
state-upgrades = []
support = "maintained"
