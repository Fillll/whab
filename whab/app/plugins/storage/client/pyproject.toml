[project]
name = "whab_plugin_client"
version = "1.6.1"
description = "HTTPS remote budget client plugin for WHAB"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["whab>=2.39,<3", "httpx==0.28.1"]

[project.entry-points."whab.plugins"]
client = "whab_plugin_client.plugin:plugin"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["whab_plugin_client", "whab_plugin_client.*"]

[tool.whab.plugin]
api-version = 1
capabilities = [{ "name" = "ledger.mutate", "version" = 1, "composition" = "singleton" }, { "name" = "ledger.read", "version" = 1, "composition" = "singleton" }]
requires = []
conflicts = []
lifecycle = "live"
legacy = false
authority = "remote"
state-version = 1
state-upgrades = []
support = "maintained"

[tool.setuptools.package-data]
whab_plugin_client = ["plugin.json"]
