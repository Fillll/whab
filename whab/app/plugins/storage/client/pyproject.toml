[project]
name = "whab_plugin_client"
version = "1.4.0"
description = "HTTPS remote budget client plugin for WHAB"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["whab>=2.19,<3", "httpx==0.28.1"]

[project.entry-points."whab.plugins"]
client = "whab_plugin_client.plugin:plugin"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["whab_plugin_client", "whab_plugin_client.*"]
