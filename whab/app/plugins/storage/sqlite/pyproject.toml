[project]
name = "whab_plugin_sqlite"
version = "1.7.0"
description = "SQLite budget storage plugin for WHAB"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["whab>=2.14.1,<3"]

[project.entry-points."whab.plugins"]
sqlite = "whab_plugin_sqlite.plugin:plugin"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["whab_plugin_sqlite", "whab_plugin_sqlite.*"]
