[project]
name = "whab_plugin_sqlite"
version = "1.10.0"
description = "SQLite budget storage plugin for WHAB"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["whab>=2.27,<3"]

[project.entry-points."whab.plugins"]
sqlite = "whab_plugin_sqlite.plugin:plugin"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["whab_plugin_sqlite", "whab_plugin_sqlite.*"]

[tool.whab.plugin]
requires = []
conflicts = []
api-version = 1
capabilities = [
  { name = "ledger.mutate", version = 1, composition = "singleton" },
  { name = "ledger.read", version = 1, composition = "singleton" },
  { name = "provider.state", version = 1, composition = "singleton" },
  { name = "provider.sync", version = 1, composition = "singleton" },
]
lifecycle = "restart"
legacy = true
authority = "unknown"
state-version = 1
state-upgrades = []
support = "maintained"
