[project]
name = "whab_plugin_example_remote_client"
version = "1.0.0"
description = "Fictional declarative WHAB remote-client teaching plugin"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["whab>=2.40,<3"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "whab_plugin_devkit>=0.9,<1", "whab_plugin_sqlite>=1.12,<2", "whab_plugin_server>=1.1,<2"]

[project.entry-points."whab.plugins"]
example-remote-client = "whab_plugin_example_remote_client:plugin"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.whab.plugin-devkit]
minimum-host = "2.40.0"
offline-remote-fixture = "fictional-v1"

[tool.whab.plugin]
api-version = 1
capabilities = [{name="ledger.mutate", version=1, composition="singleton"}, {name="ledger.read", version=1, composition="singleton"}]
requires = []
conflicts = []
lifecycle = "live"
legacy = false
authority = "remote"
state-version = 1
state-upgrades = []
support = "teaching"
