[project]
name = "whab-example-plugin"
version = "1.3.0"
description = "A small trusted insights and CSV export extension for WHAB"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["whab>=2.1,<3"]

[project.entry-points."whab.plugins"]
example = "whab_example_plugin:plugin"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
