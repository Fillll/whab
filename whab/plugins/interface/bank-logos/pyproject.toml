[project]
name = "whab-bank-logos-plugin"
version = "1.0.0"
description = "Public bank artwork plugin for WHAB"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["whab>=2,<3", "httpx==0.28.1"]

[project.entry-points."whab.plugins"]
bank-logos = "whab_bank_logos.plugin:plugin"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["whab_bank_logos", "whab_bank_logos.*"]
