[project]
name = "whab-sqlite-plugin"
version = "1.0.0"
description = "SQLite budget storage plugin for WHAB"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["whab>=2,<3"]

[project.entry-points."whab.plugins"]
sqlite = "whab_sqlite.plugin:plugin"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["whab_sqlite", "whab_sqlite.*"]
