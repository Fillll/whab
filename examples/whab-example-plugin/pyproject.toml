[project]
name = "whab-example-plugin"
version = "1.0.1"
description = "A small trusted insights and CSV export extension for WHAB"
requires-python = ">=3.14"
dependencies = ["whab>=1.1.0,<2"]

[project.entry-points."whab.plugins"]
example = "whab_example_plugin:plugin"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
